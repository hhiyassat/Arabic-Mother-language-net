<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المعجم العربي الشامل — Arabic WordNet</title>
<style>
:root {
  --green:#1a6b4a; --green2:#2d8c63; --green3:#d4eedd;
  --bg:#f5f4f1; --surface:#fff; --border:#ddd9d0;
  --text:#111; --text2:#555; --text3:#999;
  --noun:#1a5fa8; --verb:#a83218; --adj:#7b3ea8; --adv:#2d7a3a;
  --wazn-bg:#fff8e8; --wazn-border:#e8c870; --wazn-c:#7a5000;
  --wazn-badge:#f0c840; --wazn-badge-c:#5a3800;
  --rel-arrow:#aaa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}

/* HEADER */
.hdr{background:var(--green);color:#fff;padding:13px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hdr-logo{font-size:1.4rem;font-weight:800}
.hdr-sub{font-size:.75rem;opacity:.75;margin-top:1px}
.hdr-stats{margin-right:auto;font-size:.72rem;opacity:.6;direction:ltr;text-align:left}

/* TABS + SEARCH */
.search-bar{background:var(--green2);padding:12px 24px 0;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.search-tabs{display:flex;gap:4px;margin-bottom:10px}
.tab-btn{background:rgba(255,255,255,.15);color:rgba(255,255,255,.85);border:none;border-radius:6px 6px 0 0;padding:7px 18px;cursor:pointer;font-size:.85rem;font-family:inherit;transition:background .15s}
.tab-btn.active{background:#fff;color:var(--green);font-weight:700}
.search-inner{max-width:700px;margin:0 auto;position:relative}
#q{width:100%;padding:11px 18px 11px 44px;font-size:1.1rem;border:none;border-radius:8px;background:#fff;color:var(--text);direction:rtl;font-family:inherit;outline:none;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.search-clear{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#999;cursor:pointer;font-size:1rem;display:none}
.search-hint{text-align:center;color:rgba(255,255,255,.65);font-size:.76rem;padding:6px 0 10px}

/* BODY */
.body-wrap{max-width:980px;margin:0 auto;padding:20px 16px 70px}

/* LOADING */
.loading{text-align:center;padding:60px 20px;color:var(--text3)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.load-step{padding:3px 0;font-size:.8rem;transition:color .2s}
.load-step.done{color:var(--green)} .load-step.active{color:var(--text);font-weight:600}

/* WELCOME */
.welcome{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:30px;text-align:center;color:var(--text2)}
.welcome h2{color:var(--green);font-size:1.15rem;margin-bottom:10px}
.welcome p{font-size:.88rem;margin-bottom:14px;line-height:1.7}
.ex-chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}
.ex-chip{background:var(--green3);border:1px solid #a0d8b8;border-radius:20px;padding:5px 15px;cursor:pointer;font-size:.92rem;color:var(--green);font-weight:600;transition:background .12s}
.ex-chip:hover{background:#b8ecd4}
.wazn-panel{margin-top:20px;border-top:1px solid var(--border);padding-top:18px}
.wazn-panel h3{font-size:.85rem;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px}
.wazn-pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wazn-pill{background:var(--wazn-bg);border:1px solid var(--wazn-border);border-radius:8px;padding:5px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:80px;transition:background .12s}
.wazn-pill:hover{background:#fdefc8}
.wp-wazn{font-size:1rem;font-weight:700;color:var(--wazn-c)}
.wp-count{font-size:.68rem;color:var(--text3)}
.wp-op{font-size:.7rem;color:#a07020}

/* POS SECTION */
.pos-section{margin-bottom:24px}
.pos-hdr{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:7px 14px;border-radius:6px 6px 0 0;color:#fff}
.pos-hdr.n{background:var(--noun)} .pos-hdr.v{background:var(--verb)}
.pos-hdr.a,.pos-hdr.s{background:var(--adj)} .pos-hdr.r{background:var(--adv)}
.pos-body{border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;background:var(--surface)}

/* SENSE */
.sense{border-bottom:1px solid var(--border);padding:16px 18px}
.sense:last-child{border-bottom:none}
.sense-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sense-num{color:#fff;border-radius:4px;padding:1px 8px;font-size:.72rem;font-weight:700;flex-shrink:0}
.num-n{background:var(--noun)} .num-v{background:var(--verb)}
.num-a,.num-s{background:var(--adj)} .num-r{background:var(--adv)}

/* WAZN BADGE — the new star */
.wazn-badge{background:var(--wazn-badge);color:var(--wazn-badge-c);border:1px solid #d4a820;border-radius:6px;padding:2px 10px;font-size:.85rem;font-weight:700;cursor:pointer;transition:background .12s;display:inline-flex;align-items:center;gap:5px}
.wazn-badge:hover{background:#e8b010;color:#3a2000}
.wazn-badge .wb-op{font-size:.65rem;color:#8a6010;font-weight:400;margin-right:4px}
.domain-badge{background:#e8e8e8;color:var(--text2);border-radius:3px;padding:1px 7px;font-size:.7rem}

/* SYNONYMS */
.syn-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.syn-chip{background:#e8f4ee;border:1px solid #b8ddc8;border-radius:20px;padding:3px 12px;cursor:pointer;font-size:.93rem;color:#1a4a35;transition:background .12s}
.syn-chip:hover{background:#c8ecd8}
.syn-chip.primary{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
.syn-chip.primary:hover{background:var(--green2)}

/* DEFINITIONS */
.def-ar{font-size:.97rem;margin-bottom:4px}
.def-en{color:var(--text2);font-size:.82rem;font-style:italic;direction:ltr;text-align:right;margin-bottom:6px}
.examples-row{color:var(--text2);font-size:.82rem;margin-bottom:6px}
.examples-row::before{content:'مثال: ';color:var(--text3)}

/* RELATIONS */
.rels{margin-top:11px;border-top:1px dashed var(--border);padding-top:11px;display:flex;flex-direction:column;gap:8px}
.rel-row{display:flex;align-items:flex-start;gap:10px}
.rel-label{color:var(--text3);font-size:.76rem;white-space:nowrap;padding-top:3px;min-width:76px;flex-shrink:0}
.rel-label::after{content:':'}
.rel-content{flex:1}
.hyper-chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;direction:rtl}
.hyper-link{color:var(--noun);cursor:pointer;font-size:.86rem;border-bottom:1px dotted var(--noun);transition:color .12s}
.hyper-link:hover{color:var(--green)}
.hyper-arr{color:var(--rel-arrow);font-size:.78rem}
.hyper-root{color:var(--text3);font-size:.8rem;font-style:italic}
.chip-list{display:flex;flex-wrap:wrap;gap:4px}
.chip{border-radius:4px;padding:2px 8px;cursor:pointer;font-size:.82rem;transition:background .12s}
.chip-hypo{background:#eef3ff;border:1px solid #c0d0f0;color:var(--noun)}
.chip-hypo:hover{background:#d8e6fc}
.chip-mero{background:#fff6e8;border:1px solid #e8d090;color:#7a5000}
.chip-mero:hover{background:#fce8b8}
.chip-ant{background:#fff0f0;border:1px solid #f0b8b8;color:#a83218}
.chip-ant:hover{background:#fcdcdc}
.chip-sim{background:#f8f0ff;border:1px solid #d8c0f0;color:#7b3ea8}
.chip-sim:hover{background:#ecdcfc}
.chip-more{background:none;border:1px dashed #ccc;color:var(--text3);cursor:default}

/* MAQAYIS */
.maq-box{background:#faf5e8;border:1px solid #d8c070;border-radius:6px;padding:11px 14px;margin-top:10px}
.maq-badge{background:#c8a030;color:#fff;border-radius:3px;padding:1px 7px;font-size:.68rem;font-weight:700;margin-left:6px}
.maq-title{font-weight:700;font-size:1.05rem;color:#6a4000;margin-bottom:4px}
.maq-text{font-size:.85rem;color:#5a3a10;line-height:1.7}

/* SYNSET ID */
.syn-id{color:var(--text3);font-size:.7rem;direction:ltr;margin-top:4px}

/* WAZN SEARCH MODE */
.wazn-result-hdr{background:var(--wazn-bg);border:1px solid var(--wazn-border);border-radius:8px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wazn-result-big{font-size:1.8rem;font-weight:700;color:var(--wazn-c)}
.wazn-result-label{font-size:.9rem;color:#8a6010}
.wazn-result-op{font-size:.8rem;color:var(--text3);margin-top:2px}
.wazn-count-badge{background:var(--wazn-badge);color:var(--wazn-badge-c);border-radius:20px;padding:3px 12px;font-size:.82rem;font-weight:700;margin-right:auto}
.wazn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:18px}
.wazn-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.wazn-card:hover{border-color:var(--green);box-shadow:0 2px 8px rgba(26,107,74,.1)}
.wc-word{font-size:1rem;font-weight:700;color:var(--green);margin-bottom:4px}
.wc-pos{font-size:.7rem;color:var(--text3);margin-bottom:4px}
.wc-def{font-size:.8rem;color:var(--text2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wazn-show-more{text-align:center;margin-top:10px}
.show-more-btn{background:var(--green3);border:1px solid #a0d8b8;border-radius:20px;padding:7px 24px;cursor:pointer;font-size:.85rem;color:var(--green);font-weight:600;font-family:inherit}
.show-more-btn:hover{background:#b8ecd4}

/* NO RESULTS */
.no-results{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:40px;text-align:center;color:var(--text3)}
.no-results strong{color:var(--text);display:block;margin-bottom:8px;font-size:1.1rem}

/* STATUS BAR */
.status-bar{position:fixed;bottom:0;right:0;left:0;background:rgba(255,255,255,.93);border-top:1px solid var(--border);padding:5px 20px;font-size:.73rem;color:var(--text3);display:flex;justify-content:space-between;backdrop-filter:blur(4px)}

@media(max-width:600px){.rel-row{flex-direction:column;gap:3px}.rel-label{min-width:unset}.wazn-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-logo">المعجم العربي الشامل</div>
    <div class="hdr-sub">Arabic WordNet + طبقة الأوزان الصرفية</div>
  </div>
  <div class="hdr-stats">WordNet 3.1 · 102,636 مفهوم · 34 وزناً صرفياً</div>
</div>

<div class="search-bar">
  <div class="search-tabs">
    <button class="tab-btn active" id="tab-word" onclick="switchTab('word')">🔍 بحث بالكلمة</button>
    <button class="tab-btn" id="tab-wazn" onclick="switchTab('wazn')">⚖ بحث بالوزن</button>
  </div>
  <div class="search-inner">
    <input id="q" type="text" placeholder="اكتب كلمة عربية…" autocomplete="off" spellcheck="false">
    <button class="search-clear" id="clear-btn">✕</button>
  </div>
  <div class="search-hint" id="search-hint">جاري تحميل البيانات…</div>
</div>

<div class="body-wrap" id="main">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>جاري التحميل…</div>
    <div style="margin-top:10px">
      <div class="load-step active" id="step1">⏳ فهرس البحث (4 ميغا)</div>
      <div class="load-step" id="step2">⏳ بيانات المفاهيم (10 ميغا)</div>
      <div class="load-step" id="step3">⏳ شجرة العلاقات (13 ميغا)</div>
      <div class="load-step" id="step4">⏳ الأوزان الصرفية (7 ميغا)</div>
      <div class="load-step" id="step5">⏳ معجم مقاييس اللغة</div>
    </div>
  </div>
</div>

<div class="status-bar">
  <span id="status-l">جاري التحميل…</span>
  <span id="status-r" style="color:var(--green)"></span>
</div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────
const BASE    = './data/wordnet/';
const MAQ_P   = '../Maqaiys-roots/output/maqayis_all_roots.json';

let IDX   = null;  // {word: [sid]}
let SYNS  = null;  // {sid: obj}
let RELS  = null;  // {sid: {hypernyms,...}}
let WAZN  = null;  // {wazn_map:{sid:wazn_obj}, wazn_index:{label:[sids]}}
let MAQ   = null;  // {letters: entry}

let relsReady = false, waznReady = false, maqReady = false;

const POS_AR = {n:'اسم', v:'فعل', a:'صفة', s:'صفة', r:'ظرف'};
const POS_EN = {n:'Noun', v:'Verb', a:'Adj', s:'Adj', r:'Adv'};

let MODE = 'word';  // 'word' | 'wazn'
let waznShowLimit = 60;

// ── NORMALIZE ──────────────────────────────────────────────────────────────
function norm(s){
  return (s||'').replace(/[\u064B-\u065F\u0670]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى$/,'ي').replace(/ة$/,'ه').trim();
}

// ── LOAD ──────────────────────────────────────────────────────────────────
function stepDone(id){
  const el=document.getElementById(id);
  if(!el)return;
  el.classList.remove('active');el.classList.add('done');
  el.textContent='✓ '+el.textContent.slice(2);
  const all=['step1','step2','step3','step4','step5'];
  const nx=all[all.indexOf(id)+1];
  if(nx)document.getElementById(nx).classList.add('active');
}
function setStatus(t){document.getElementById('status-l').textContent=t;document.getElementById('search-hint').textContent=t}
function setStatusR(t){document.getElementById('status-r').textContent=t}

async function loadAll(){
  try{
    const r1=await fetch(BASE+'wordnet_search_index.json');
    IDX=await r1.json(); stepDone('step1'); setStatus('فهرس البحث جاهز');

    const r2=await fetch(BASE+'wordnet_synsets.json');
    const raw2=await r2.json();
    SYNS={};
    (raw2.synsets||raw2).forEach(s=>SYNS[s.id]=s);
    stepDone('step2'); setStatus('المفاهيم جاهزة — يمكنك البحث');
    showWelcome();

    const r3=await fetch(BASE+'wordnet_relations.json');
    RELS=await r3.json(); relsReady=true; stepDone('step3');
    setStatus('شجرة العلاقات جاهزة'); redraw();

    const r4=await fetch(BASE+'wordnet_wazn.json');
    WAZN=await r4.json(); waznReady=true; stepDone('step4');
    setStatus('الأوزان الصرفية جاهزة'); redraw(); showWelcome();

    const r5=await fetch(MAQ_P);
    const raw5=await r5.json();
    MAQ={};
    (raw5.roots||raw5).forEach(r=>{
      const k=norm(r.root_display||r.letters||'');
      MAQ[k]=r; if(r.letters)MAQ[r.letters]=r;
    });
    maqReady=true; stepDone('step5'); setStatusR('مقاييس ابن فارس جاهز ✓'); redraw();
  }catch(e){
    document.getElementById('main').innerHTML=
      `<div class="no-results"><strong>خطأ</strong><p>شغّل من مجلد arabic-net: <code>python3 -m http.server 8000</code></p><p style="color:#c00">${e.message}</p></div>`;
  }
}

function redraw(){
  const q=document.getElementById('q').value.trim();
  if(!q) return;
  if(MODE==='word') doWordSearch(q);
  else doWaznSearch(q);
}

// ── TAB SWITCH ─────────────────────────────────────────────────────────────
function switchTab(t){
  MODE=t;
  document.getElementById('tab-word').classList.toggle('active',t==='word');
  document.getElementById('tab-wazn').classList.toggle('active',t==='wazn');
  const ph=t==='word'?'اكتب كلمة عربية…':'اكتب وزناً (مثل: فَاعِل، مَفْعُول)…';
  document.getElementById('q').placeholder=ph;
  document.getElementById('q').value='';
  document.getElementById('clear-btn').style.display='none';
  showWelcome();
}

// ── WELCOME ────────────────────────────────────────────────────────────────
function showWelcome(){
  const loading=document.getElementById('loading');
  if(loading)loading.remove();

  let waznPills='';
  if(waznReady && WAZN){
    const idx=WAZN.wazn_index||{};
    const wmap=WAZN.wazn_map||{};
    // Build list of unique wazns sorted by count
    const seen={};
    Object.entries(idx).sort((a,b)=>b[1].length-a[1].length).forEach(([label,sids])=>{
      const sample=wmap[sids[0]]||{};
      const wazn=sample.wazn||label;
      const op=sample.op||'';
      if(!seen[wazn]){
        seen[wazn]=true;
        waznPills+=`<div class="wazn-pill" onclick="searchWazn('${esc(label)}')">
          <div class="wp-wazn">${wazn}</div>
          <div class="wp-op">${op}</div>
          <div class="wp-count">${sids.length.toLocaleString('ar')} معنى</div>
        </div>`;
      }
    });
  }

  const examples=['قطة','كتاب','علم','ماء','شجرة','قلب','نور','حكمة','بيت'];
  document.getElementById('main').innerHTML=`
    <div class="welcome">
      <h2>المعجم العربي الشامل — Arabic WordNet + الأوزان</h2>
      <p>102,636 مفهوم عربي في شجرة WordNet العالمية،<br>
         مع علاقات كاملة (نوع من / أنواعه / يتكون من / عكسه) وأوزان صرفية مربوطة بالشجرة.</p>
      <div class="ex-chips">
        ${examples.map(w=>`<span class="ex-chip" onclick="search('${w}')">${w}</span>`).join('')}
      </div>
      ${waznPills?`<div class="wazn-panel"><h3>⚖ أوزان صرفية — انقر لعرض كل الكلمات على نفس الوزن</h3><div class="wazn-pills">${waznPills}</div></div>`:''}
    </div>`;
  setStatus(waznReady?'جاهز — ابحث بالكلمة أو انقر وزناً':'جاري تحميل الأوزان…');
}

// ── WORD SEARCH ────────────────────────────────────────────────────────────
let debT=null;
document.getElementById('q').addEventListener('input',e=>{
  clearTimeout(debT);
  const v=e.target.value.trim();
  document.getElementById('clear-btn').style.display=v?'block':'none';
  if(!v){showWelcome();return;}
  debT=setTimeout(()=>{ if(MODE==='word') doWordSearch(v); else doWaznSearch(v); },220);
});
document.getElementById('clear-btn').addEventListener('click',()=>{
  document.getElementById('q').value='';
  document.getElementById('clear-btn').style.display='none';
  showWelcome();
});

function search(word){
  MODE='word';
  document.getElementById('tab-word').classList.add('active');
  document.getElementById('tab-wazn').classList.remove('active');
  document.getElementById('q').value=word;
  document.getElementById('clear-btn').style.display='block';
  doWordSearch(word);
}

function searchWazn(label){
  MODE='wazn';
  document.getElementById('tab-wazn').classList.add('active');
  document.getElementById('tab-word').classList.remove('active');
  document.getElementById('q').value=label;
  document.getElementById('clear-btn').style.display='block';
  waznShowLimit=60;
  doWaznSearch(label);
}

function doWordSearch(word){
  if(!IDX||!SYNS)return;
  const nw=norm(word);
  let ids=[];
  for(const[k,v]of Object.entries(IDX)){if(norm(k)===nw)ids.push(...v);}
  if(!ids.length)for(const[k,v]of Object.entries(IDX)){if(norm(k).includes(nw))ids.push(...v);}
  ids=[...new Set(ids)];
  if(!ids.length){
    document.getElementById('main').innerHTML=`<div class="no-results"><strong>لا توجد نتائج لـ "${word}"</strong><p>جرّب كلمة أخرى</p></div>`;
    return;
  }
  const byPos={n:[],v:[],a:[],s:[],r:[]};
  ids.forEach(id=>{const s=SYNS[id];if(s)(byPos[s.pos||'n']).push(s);});
  let html='';
  ['n','v','a','s','r'].forEach(pos=>{
    const g=byPos[pos]; if(!g.length)return;
    html+=`<div class="pos-section">
      <div class="pos-hdr ${pos}">${POS_AR[pos]} — ${POS_EN[pos]} (${g.length})</div>
      <div class="pos-body">${g.map((s,i)=>renderSense(s,i+1,pos,word)).join('')}</div>
    </div>`;
  });
  document.getElementById('main').innerHTML=html;
  setStatus(`${ids.length} معنى لـ "${word}"`);
}

// ── WAZN SEARCH ────────────────────────────────────────────────────────────
function doWaznSearch(query){
  if(!waznReady||!WAZN){
    document.getElementById('main').innerHTML='<div class="no-results"><strong>الأوزان تُحمَّل…</strong></div>';
    return;
  }
  const idx=WAZN.wazn_index||{};
  const wmap=WAZN.wazn_map||{};
  const nq=norm(query);

  // Find matching label
  let matchLabel=null, matchSids=[];
  for(const[label,sids]of Object.entries(idx)){
    const sample=wmap[sids[0]]||{};
    const waznN=norm(sample.wazn||'');
    const labelN=norm(label);
    if(labelN===nq||waznN===nq||(labelN.includes(nq)&&nq.length>2)){
      matchLabel=label; matchSids=sids; break;
    }
  }
  if(!matchLabel||!matchSids.length){
    document.getElementById('main').innerHTML=`<div class="no-results"><strong>لا يوجد وزن مطابق لـ "${query}"</strong><p>انقر على أحد الأوزان في الصفحة الرئيسية</p></div>`;
    return;
  }
  const sample=wmap[matchSids[0]]||{};
  const wazn=sample.wazn||matchLabel;
  const op=sample.op||'';

  const shown=matchSids.slice(0,waznShowLimit);
  const cards=shown.map(sid=>{
    const s=SYNS[sid]||{}; if(!s.id)return'';
    const words=(s.words_ar||[]).filter(Boolean);
    const def=s.def_ar||s.def_en||'';
    const pos=s.pos||'n';
    return `<div class="wazn-card" onclick="search('${esc(words[0]||'')}')">
      <div class="wc-word">${words.slice(0,3).join(' · ')||'—'}</div>
      <div class="wc-pos">${POS_AR[pos]||pos} · ${sid}</div>
      ${def?`<div class="wc-def">${def}</div>`:''}
    </div>`;
  }).join('');

  const more=matchSids.length>waznShowLimit?
    `<div class="wazn-show-more"><button class="show-more-btn" onclick="loadMoreWazn('${esc(matchLabel)}')">عرض ${Math.min(60,matchSids.length-waznShowLimit)} أخرى (من ${matchSids.length-waznShowLimit})</button></div>`:'';

  document.getElementById('main').innerHTML=`
    <div class="wazn-result-hdr">
      <div>
        <div class="wazn-result-big">${wazn}</div>
        <div class="wazn-result-label">${matchLabel}</div>
        <div class="wazn-result-op">العملية الدلالية: ${op}</div>
      </div>
      <div class="wazn-count-badge">${matchSids.length.toLocaleString('ar')} مفهوم</div>
    </div>
    <div class="wazn-grid">${cards}</div>
    ${more}`;
  setStatus(`وزن "${wazn}" — ${matchSids.length} مفهوم`);
}

function loadMoreWazn(label){
  waznShowLimit+=60;
  doWaznSearch(label);
}

// ── RENDER SENSE ───────────────────────────────────────────────────────────
function renderSense(s,num,pos,searchWord){
  const sid=s.id||'';
  const words=(s.words_ar||[]).filter(Boolean);
  const nw=norm(searchWord);

  const chips=words.map(w=>`<span class="syn-chip${norm(w)===nw?' primary':''}" onclick="search('${esc(w)}')">${w}</span>`).join('');

  // Wazn badge
  let waznBadge='';
  if(waznReady&&WAZN){
    const we=(WAZN.wazn_map||{})[sid];
    if(we){
      waznBadge=`<span class="wazn-badge" onclick="searchWazn('${esc(we.label)}')" title="${we.op}">
        ⚖ ${we.wazn}<span class="wb-op">${we.op}</span>
      </span>`;
    }
  }

  const domain=s.domain?`<span class="domain-badge">${s.domain}</span>`:'';

  let html=`<div class="sense-meta">
      <span class="sense-num num-${pos}">${num}</span>
      ${waznBadge}${domain}
    </div>
    <div class="syn-chips">${chips||'<span style="color:var(--text3)">—</span>'}</div>`;

  if(s.def_ar) html+=`<div class="def-ar">${s.def_ar}</div>`;
  if(s.def_en) html+=`<div class="def-en">${s.def_en}</div>`;

  html+=renderRelations(sid);
  html+=renderMaqayis(s.roots||[]);
  html+=`<div class="syn-id">${sid}</div>`;

  return`<div class="sense">${html}</div>`;
}

// ── RELATIONS ──────────────────────────────────────────────────────────────
function renderRelations(sid){
  if(!relsReady) return`<div class="rels"><em style="color:var(--text3);font-size:.8rem">⏳ تحميل شجرة العلاقات…</em></div>`;
  const rel=RELS[sid]||{};
  let rows='';

  const chain=hyperChain(sid);
  if(chain.length>1) rows+=rRow('نوع من',renderChain(chain));

  const hypo=[...(rel.hyponyms||[]),...(rel.instance_hyponyms||[])];
  if(hypo.length) rows+=rRow('أنواعه',chipList(hypo,'chip-hypo',14));

  if(rel.part_meronyms?.length)   rows+=rRow('يتكون من',chipList(rel.part_meronyms,'chip-mero',8));
  if(rel.substance_meronyms?.length) rows+=rRow('مادته',chipList(rel.substance_meronyms,'chip-mero',6));
  if(rel.member_meronyms?.length) rows+=rRow('أعضاؤه',chipList(rel.member_meronyms,'chip-mero',6));
  if(rel.part_holonyms?.length)   rows+=rRow('جزء من',chipList(rel.part_holonyms,'chip-mero',6));
  if(rel.member_holonyms?.length) rows+=rRow('عضو في',chipList(rel.member_holonyms,'chip-mero',6));
  if(rel.antonyms?.length)        rows+=rRow('عكسه',chipList(rel.antonyms,'chip-ant',6));
  if(rel.similar_to?.length)      rows+=rRow('مشابه لـ',chipList(rel.similar_to,'chip-sim',8));
  if(rel.also_see?.length)        rows+=rRow('انظر أيضاً',chipList(rel.also_see,'chip-sim',6));
  if(rel.entailments?.length)     rows+=rRow('يستلزم',chipList(rel.entailments,'chip-sim',5));
  if(rel.causes?.length)          rows+=rRow('يتسبب في',chipList(rel.causes,'chip-sim',5));
  if(rel.derivations?.length)     rows+=rRow('مشتقاته',chipList(rel.derivations,'chip-sim',6));

  if(!rows)return'';
  return`<div class="rels">${rows}</div>`;
}

function rRow(label,content){
  return`<div class="rel-row"><span class="rel-label">${label}</span><div class="rel-content">${content}</div></div>`;
}

function hyperChain(sid){
  const chain=[sid]; let cur=sid; const seen=new Set([sid]);
  for(let i=0;i<15;i++){
    const r=RELS[cur]||{}; const p=(r.hypernyms||r.instance_hypernyms||[])[0];
    if(!p||seen.has(p))break; seen.add(p); chain.push(p); cur=p;
    if(p==='entity.n.01')break;
  }
  return chain;
}

function renderChain(chain){
  return`<div class="hyper-chain">${chain.slice(1).map((id,i,arr)=>{
    const ws=synWords(id); const label=ws[0]||id.split('.')[0].replace(/_/g,' ');
    const title=(ws.join('، ')||'')+' — '+id;
    const isRoot=i===arr.length-1;
    return(isRoot?`<span class="hyper-root" title="${title}">${label}</span>`:
      `<span class="hyper-link" title="${title}" onclick="search('${esc(label)}')">${label}</span>`)
      +(i<arr.length-1?'<span class="hyper-arr"> ← </span>':'');
  }).join('')}</div>`;
}

function chipList(ids,cls,max){
  const sh=ids.slice(0,max); const rest=ids.length-max;
  return`<div class="chip-list">${sh.map(id=>{
    const ws=synWords(id); const label=ws[0]||id.split('.')[0].replace(/_/g,' ');
    return`<span class="chip ${cls}" onclick="search('${esc(label)}')" title="${id}">${label}</span>`;
  }).join('')}${rest>0?`<span class="chip chip-more">+${rest}</span>`:''}</div>`;
}

function synWords(id){
  const s=SYNS[id]; return s&&s.words_ar?s.words_ar.filter(Boolean).slice(0,3):[];
}

// ── MAQAYIS ────────────────────────────────────────────────────────────────
function renderMaqayis(roots){
  if(!maqReady||!MAQ||!roots.length)return'';
  let found=null;
  for(const r of roots){const k=norm(r);if(MAQ[k]){found=MAQ[k];break;}if(MAQ[r]){found=MAQ[r];break;}}
  if(!found)return'';
  return`<div class="maq-box">
    <div class="maq-title"><span class="maq-badge">مقاييس</span>${found.root_display||found.letters||''}</div>
    ${found.body_snippet?`<div class="maq-text">${found.body_snippet}</div>`:''}
  </div>`;
}

// ── UTILS ──────────────────────────────────────────────────────────────────
function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}

// ── INIT ───────────────────────────────────────────────────────────────────
loadAll();
</script>
